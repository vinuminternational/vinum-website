name: Batch wine image candidate review
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of active products to process (1-10)
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '5'
          - '10'
permissions:
  contents: write
  pull-requests: write
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-image.txt
      - run: pip install -r scripts/requirements-image.txt
      - name: Search and prepare candidate images
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BATCH_LIMIT: ${{ inputs.limit }}
        run: python scripts/batch_wine_images.py --csv image-products.csv --limit "$BATCH_LIMIT"
      - name: Create a single batch review PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: image-review/batch-${{ github.run_id }}
          delete-branch: true
          title: "Batch wine bottle image review #${{ github.run_number }}"
          body: |
            Candidate images only; no catalog or website changes.
            Review every product label, cutout, source and commercial reuse rights.
            Do not merge unapproved candidate images.
          add-paths: image-review/
          commit-message: "Prepare batch wine image candidates for review"
