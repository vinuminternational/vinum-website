name: Prepare next 13 Ichon bottle candidates
on:
  push:
    branches:
      - ichon-next-13-cutout-review-20261119
    paths:
      - 'scripts/prepare_ichon_next_13.py'
      - '.github/workflows/ichon-next-13-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ichon-next-13-cutout-review-20261119
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-image.txt
      - run: pip install -r scripts/requirements-image.txt
      - name: Search and cut out product images for manual review
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/prepare_ichon_next_13.py
      - name: Commit review candidates (not live images)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-review/ichon-next-13/
          git diff --cached --quiet || (git commit -m "Prepare remaining Ichon image candidates" && git push)
